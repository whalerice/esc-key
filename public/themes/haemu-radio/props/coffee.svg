<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243440"/>
      <stop offset="100%" stop-color="#12191F"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4B06A"/>
      <stop offset="55%" stop-color="#B08D4F"/>
      <stop offset="100%" stop-color="#7A6232"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#BFCAD0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#12191F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2.5" y="2.5" width="59" height="59" rx="7" fill="url(#bg)" stroke="#B08D4F" stroke-width="2"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="7" fill="url(#glow)"/>
  <!-- saucer -->
  <ellipse cx="30" cy="48" rx="16" ry="4" fill="#3a4448"/>
  <ellipse cx="30" cy="46" rx="14" ry="3.2" fill="#5D6668"/>
  <!-- cup -->
  <path d="M16 24 h28 l-3 20 a4 4 0 0 1 -4 3 H23 a4 4 0 0 1 -4 -3 z" fill="#F4EBD0"/>
  <path d="M18 26 h24 l-0.6 4 H18.6 z" fill="#E9E2D2"/>
  <!-- coffee surface -->
  <ellipse cx="30" cy="28" rx="11" ry="3.5" fill="#6B4E3A"/>
  <ellipse cx="28" cy="27" rx="4" ry="1.2" fill="#8a6a4a" opacity="0.5"/>
  <!-- handle -->
  <path d="M44 28 h5 a7 7 0 0 1 0 14 h-4" fill="none" stroke="#E9E2D2" stroke-width="2.2" stroke-linecap="round"/>
  <!-- steam -->
  <path d="M24 18 q2 -4 0 -7" fill="none" stroke="#A9B4B9" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <path d="M30 16 q2 -4 0 -7" fill="none" stroke="#A9B4B9" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <path d="M36 18 q2 -3 0 -6" fill="none" stroke="#A9B4B9" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <!-- key hint under cup: faint brass gleam -->
  <ellipse cx="30" cy="49.5" rx="6" ry="1.2" fill="url(#brass)" opacity="0.35"/>
</svg>
