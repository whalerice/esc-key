<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243440"/>
      <stop offset="100%" stop-color="#12191F"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4B06A"/>
      <stop offset="55%" stop-color="#B08D4F"/>
      <stop offset="100%" stop-color="#7A6232"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#BFCAD0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#12191F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2.5" y="2.5" width="59" height="59" rx="7" fill="url(#bg)" stroke="#B08D4F" stroke-width="2"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="7" fill="url(#glow)"/>
  <!-- key bow -->
  <circle cx="20" cy="24" r="9" fill="none" stroke="url(#brass)" stroke-width="3"/>
  <circle cx="20" cy="24" r="4" fill="none" stroke="url(#brass)" stroke-width="1.5"/>
  <!-- shaft -->
  <rect x="28" y="22" width="22" height="4" rx="1" fill="url(#brass)"/>
  <rect x="42" y="22" width="3" height="8" rx="0.5" fill="url(#brass)"/>
  <rect x="47" y="22" width="3" height="6" rx="0.5" fill="url(#brass)"/>
  <!-- ring -->
  <circle cx="20" cy="24" r="1.5" fill="#12191F"/>
  <!-- boat tag -->
  <path d="M14 44 l10 -5 14 5 -3 5 H17 z" fill="#E9E2D2" stroke="#3B3A36" stroke-width="0.8"/>
  <path d="M24 39 v-8" stroke="#3B3A36" stroke-width="1.2"/>
  <path d="M24 33 l8 3" stroke="#3B3A36" stroke-width="1"/>
</svg>
