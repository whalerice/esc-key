<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243440"/>
      <stop offset="100%" stop-color="#12191F"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4B06A"/>
      <stop offset="55%" stop-color="#B08D4F"/>
      <stop offset="100%" stop-color="#7A6232"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#BFCAD0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#12191F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2.5" y="2.5" width="59" height="59" rx="7" fill="url(#bg)" stroke="#B08D4F" stroke-width="2"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="7" fill="url(#glow)"/>
  <rect x="10" y="16" width="44" height="34" rx="4" fill="#2a241c" stroke="url(#brass)" stroke-width="1.8"/>
  <rect x="12" y="18" width="40" height="8" rx="1" fill="#1a1814"/>
  <!-- masking tape -->
  <rect x="18" y="14" width="28" height="5" rx="0.5" fill="#E9E2D2" opacity="0.85" transform="rotate(-2 32 16)"/>
  <!-- speaker grille -->
  <g stroke="#5D6668" stroke-width="0.7" opacity="0.7">
    <path d="M14 30 h16 M14 33 h16 M14 36 h16 M14 39 h16 M14 42 h16"/>
  </g>
  <!-- tuning knob -->
  <circle cx="42" cy="36" r="9" fill="#6a5428" stroke="#E9E2D2" stroke-width="1.5"/>
  <circle cx="42" cy="36" r="5.5" fill="url(#brass)"/>
  <rect x="41" y="28" width="2" height="7" rx="0.5" fill="#F4EBD0"/>
  <!-- broken digit window: only 9 -->
  <rect x="34" y="20" width="16" height="10" rx="1" fill="#12191F"/>
  <text x="39" y="28.5" fill="#6FBF73" font-family="monospace" font-size="9" font-weight="700">9</text>
</svg>
